name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: hint
          POSTGRES_PASSWORD: hint
          POSTGRES_DB: hint
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hint -d hint"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      HINT_DATABASE_URL: postgresql://hint:hint@localhost:5432/hint
      HINT_ASYNC_DATABASE_URL: postgresql+asyncpg://hint:hint@localhost:5432/hint
      TEST_DATABASE_URL: postgresql+asyncpg://hint:hint@localhost:5432/hint
      HINT_JWT_SECRET: ci-test-secret-0123456789abcdefghijklmnop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e ".[dev]"
      - name: Migrations
        run: alembic upgrade head
      - name: Lint (ruff)
        run: ruff check .
      - name: Format check (ruff)
        run: ruff format --check .
      - name: Type check (mypy)
        run: mypy app
      - name: Tests
        run: pytest
      - name: OpenAPI şeması güncel mi
        run: |
          python -m scripts.export_openapi ../client/openapi.json
          git diff --exit-code ../client/openapi.json

  client:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/client/package-lock.json
      - name: Install
        run: npm ci
      - name: API tipleri güncel mi
        run: |
          npm run gen:api
          git diff --exit-code src/api/schema.d.ts
      - name: Lint
        run: npm run lint
      - name: Type check
        run: npm run typecheck
      - name: Tests
        run: npm test -- --ci
      - name: Web export
        run: npx expo export --platform web

  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Start stack
        run: docker compose up -d --build
      - name: Wait for healthz
        run: |
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8000/healthz > /dev/null; then
              echo "api ready"
              exit 0
            fi
            sleep 2
          done
          echo "api did not become ready"
          docker compose logs
          exit 1
      - name: Check readiness (db + redis)
        run: curl -fsS http://localhost:8000/readyz
      - name: Tear down
        if: always()
        run: docker compose down -v
